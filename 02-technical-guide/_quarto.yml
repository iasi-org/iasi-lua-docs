project:
  type: book
  resources:
    - resources/**

profile:
  default: html

metadata-files:
  - _book-structure.yml

book:
  title: "IASI Lua Technical Guide"
  subtitle: "Arquitectura y desarrollo de extensiones Lua para Quarto"
  author: "IASI Project"

  navbar:
    title: "IASI"
    background: primary
    pinned: true
    left:
      - text: "User Guide"
        href: ../user-guide/
      - text: "Technical Guide"
        href: index.qmd
    right:
      - icon: github
        aria-label: "GitHub repository"
        href: https://github.com/iasi-org/iasi-lua

format:
  html:
    toc: true
    number-sections: true
    include-in-header:
      - resources/includes/ants.html

  pdf:
    documentclass: scrreprt
    toc: true
    number-sections: true

execute:
  freeze: auto
